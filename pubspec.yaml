name: shelf_scan
description: Scan book spines with on-device OCR.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Live camera feed
  camera: ^0.11.0

  # On-device text recognition (ML Kit, no cloud)
  google_mlkit_text_recognition: ^0.13.0

  # Image decode/rotate for multi-orientation OCR (spine titles are rotated 90°)
  image: ^4.1.0

  # HTTP for Open Library API lookups
  http: ^1.2.0

  # Local SQLite cache for book results
  sqflite: ^2.3.0
  path: ^1.9.0

  # Runtime permission requests (camera denial → Settings prompt)
  permission_handler: ^11.3.0

  # Google Fonts: Cormorant Garamond + Lora for the literary UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
